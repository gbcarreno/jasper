<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Proyecto — Tercera Fuente</title>
  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="apple-touch-icon" href="/assets/favicon.png">

  <style>
    /* CARGA DE LA FUENTE LOCAL DESDE /fonts/ */
    @font-face {
      font-family: 'CourierPrimeCustom';
      src: url('/fonts/CourierPrime-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'CourierPrimeCustom';
      src: url('/fonts/CourierPrime-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'CourierPrimeCustom';
      src: url('/fonts/CourierPrime-Italic.ttf') format('truetype');
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: 'CourierPrimeCustom';
      src: url('/fonts/CourierPrime-BoldItalic.ttf') format('truetype');
      font-weight: 700;
      font-style: italic;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      background-color: #000000;
      color: #ffffff;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* BARRA DE NAVEGACIÓN */
    header.site-header {
      background-color: #0d0d0d;
      border-bottom: 1px solid #222222;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .brand h1 {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin: 0;
    }

    .brand h1 a {
      color: inherit;
      text-decoration: none;
    }

    .brand span.tagline {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.85rem;
      color: #777777;
      border-left: 1px solid #333333;
      padding-left: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    nav ul {
      display: flex;
      list-style: none;
      gap: 1.8rem;
      align-items: center;
      margin: 0;
      padding: 0;
    }

    nav a {
      color: #aaaaaa;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #ffffff;
    }

    nav a.active {
      color: #ffffff;
      font-weight: 600;
      border-bottom: 2px solid #00e676;
      padding-bottom: 4px;
    }

    nav .disabled {
      color: #444444;
      cursor: not-allowed;
      font-size: 0.9rem;
    }

    nav .disabled::after {
      content: " (Pronto)";
      font-size: 0.7rem;
      color: #555555;
    }

    /* CONTENIDO EDITORIAL */
    main {
      flex: 1;
      max-width: 720px;
      margin: 3.5rem auto;
      padding: 0 1.5rem;
      line-height: 1.8;
    }

    h1, h2, h3, h4 {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      letter-spacing: -0.02em;
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1.5rem;
      border-bottom: 1px solid #222222;
      padding-bottom: 0.8rem;
    }

    h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #00e676;
      margin: 2.5rem 0 1rem 0;
    }

    p {
      font-family: Georgia, "Times New Roman", serif;
      color: #dddddd;
      font-size: 1.05rem;
      margin-bottom: 1.4rem;
      text-align: justify;
    }

    .independencia-section, .contacto-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px dashed #222222;
    }

    .canales-lista {
      list-style: none !important;
      margin-left: 0 !important;
      margin-top: 1.2rem;
    }

    .canales-lista li {
      font-family: Georgia, "Times New Roman", serif;
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }

    .canales-lista strong {
      color: #ffffff;
    }

    .canales-lista a {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      color: #00e676;
      text-decoration: underline;
      text-underline-offset: 3px;
      font-weight: 600;
      word-break: break-all;
    }

    .canales-lista a:hover {
      color: #ffffff;
    }

    .canal-desc {
      display: block;
      font-size: 0.9rem;
      color: #888888;
      margin-top: 0.2rem;
    }

    /* ESTILOS DEL PIE DE PÁGINA (100% COURIER) */
    footer {
      background-color: #0d0d0d;
      border-top: 1px solid #222222;
      padding: 2.5rem 2rem 2rem;
      margin-top: auto;
      width: 100%;
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace !important;
    }

    .footer-container {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      text-align: center;
    }

    .footer-title {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      font-weight: 700;
      font-size: 1.1rem;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-right: 0.5rem;
    }

    .footer-desc {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      color: #888888;
      font-size: 0.85rem;
    }

    .footer-meta p {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace !important;
      font-size: 0.8rem !important;
      color: #888888 !important;
      margin-bottom: 0.4rem !important;
      line-height: 1.5 !important;
    }

    .footer-meta a {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      color: #aaaaaa;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s ease;
    }

    .footer-meta a:hover {
      color: #00e676;
    }

    .footer-copy {
      font-family: 'CourierPrimeCustom', "Courier New", Courier, monospace;
      font-size: 0.75rem;
      color: #555555;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.5rem;
    }

    /* ADAPTABILIDAD MÓVIL (RESPONSIVE) */
    @media (max-width: 640px) {
      header.site-header {
        flex-direction: column;
        gap: 1rem;
        padding: 1rem;
      }

      .brand span.tagline {
        display: none;
      }

      nav ul {
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      nav
