# Jekyll configuration
markdown: kramdown
highlighter: rouge
paginate: 5
language: 'es'

# Website info
name: 'Tercerafuente'
description: 'Atlas socioambiental en Latinoamérica'

short_url: 'www.tercerafuente.org'
google_analytics: ''
disqus: ''

# IMPORTANTE: Al usar dominio propio personalizado (tercerafuente.org), 
# baseurl DEBE ser una cadena vacía o '/' en lugar de '/jasper/'
baseurl: ''

# Permalinks
permalink: /:title

# Gems and plugins
plugins: [jekyll-paginate]

# Settings for deployment
safe: false
lsi: false
username: gbcarreno
repo: jasper
branch: master

exclude:
  - README.md
  - Rakefile
  - Gemfile
  - Gemfile.lock
  - changelog.md
  - "*.Rmd"
  - vendor
  - .travis.yml
  - node_modules
  - .git
